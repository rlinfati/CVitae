name: renovate
on:
  schedule:
    - cron: '0 5 * * 1' # min hour day-of-month month day-of-week: Mondays 05:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  renovate:
    runs-on: ubuntu-26.04
    steps:
      - uses: renovatebot/github-action@v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: debug
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: optional
